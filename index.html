<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localização - Lisboa</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      overflow: hidden;
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 15, 18, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 50px;
      padding: 8px 18px 8px 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    .pin-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(83, 252, 24, 0.4);
      animation: pulse 2s infinite ease-out;
    }

    .pin-icon {
      width: 16px;
      height: 16px;
      fill: #53fc18;
      z-index: 1;
    }

    .location-text {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .country {
      color: #b3b3b3;
      font-weight: 600;
      font-size: 13px;
    }

    .flag {
      font-size: 16px;
      line-height: 1;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.7);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

    <div class="pin-wrapper">
      <div class="pulse-ring"></div>
